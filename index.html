<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2d6b55">
<title>个人成长工作台 · LIFE COCKPIT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233a8c6f'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='white'%3E%E6%88%90%3C/text%3E%3C/svg%3E">
<style>
/* ============ 设计系统 ============ */
:root{
  --bg:#f2f6f2; --card:#ffffff; --shadow:0 1px 6px rgba(0,0,0,.05);
  --text:#1c2a23; --text-dim:#5f7a6c; --text-place:#93a89c; --border:#e0eae2;
  --main:#3a8c6f; --main-light:#e6f3ec; --main-dark:#2d6b55; --accent:#5ba88a;
  --red:#d64541; --red-bg:#fdecea; --orange:#e67e22; --orange-bg:#fdf3e4;
  --blue:#2980b9; --blue-bg:#e7f0f8; --gray:#7f8c8d; --gray-bg:#eef1f1;
  --done:#3a8c6f; --undone:#cfd8d0; --tip:#e67e22;
  --radius:12px; --radius-s:8px;
  --nav-h:60px; /* 移动端底部导航高度 */
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  background:var(--bg); color:var(--text); line-height:1.55; font-size:15px;
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
  min-height:100%; overflow-x:hidden;
}
button{font-family:inherit;}
input,textarea,select{font-family:inherit;color:var(--text);}
.app{display:flex; min-height:100dvh;}
/* ============ 左侧导航（桌面） ============ */
.sidebar{
  width:216px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:18px 0;position:sticky;top:0;height:100dvh;
}
.brand{font-size:17px;font-weight:700;color:var(--main-dark);padding:0 20px 2px;}
.brand span{display:block;font-size:10px;letter-spacing:2px;color:var(--text-place);font-weight:400;}
.nav-date{padding:0 20px 14px;font-size:12px;color:var(--text-dim);}
.nav-items{display:flex;flex-direction:column;gap:3px;padding:0 12px;flex:1;}
.nav-item{
  display:flex;align-items:center;gap:10px;min-height:46px;padding:0 14px;border:none;background:transparent;
  color:var(--text);font-size:15px;text-align:left;border-radius:10px;cursor:pointer;
}
.nav-item .ico{font-size:18px;width:24px;text-align:center;}
.nav-item .bdg{margin-left:auto;font-size:11px;background:var(--main-light);color:var(--main-dark);border-radius:10px;padding:1px 8px;font-weight:600;}
.nav-item.active{background:var(--main-light);color:var(--main-dark);font-weight:600;}
.nav-item:active{background:var(--main-light);}
.nav-bottom{padding:12px 12px 0;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;}
.nav-btn{min-height:42px;border:1px solid var(--main);background:transparent;color:var(--main);border-radius:10px;cursor:pointer;font-size:13px;}
.nav-btn:active{background:var(--main-light);}
/* ============ 内容区 ============ */
.content{flex:1;min-width:0;position:relative;}
.scroll{max-width:1080px;margin:0 auto;padding:16px 22px 40px;}
/* 顶栏 */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 22px 0;}
.tb-title{font-size:19px;font-weight:700;color:var(--main-dark);}
.tb-title small{display:block;font-size:11px;letter-spacing:1px;color:var(--text-place);font-weight:400;margin-top:2px;}
.tb-date{font-size:13px;color:var(--text-dim);background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 14px;white-space:nowrap;}
/* ============ 目标模块 ============ */
.goal-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;}
.kr-top{display:flex;align-items:flex-start;gap:10px;}
.kr-pct-badge{font-size:15px;font-weight:700;color:var(--main-dark);background:var(--bg);border-radius:10px;padding:4px 10px;white-space:nowrap;flex-shrink:0;}
.kr-status{margin-top:12px;background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text-dim);}
.kr-status .st-t{font-weight:700;color:var(--main-dark);font-size:12px;}
.kr-status .st-t.b1{color:var(--orange);}
.kr-status .st-t.b2{color:var(--blue);}
.blk-item{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;}
.blk-item .nm{color:var(--text);}
.blk-item .rs{color:var(--orange);font-size:12px;}
.suggest{font-size:13px;color:var(--main-dark);line-height:1.6;}
.chip.goal{background:var(--blue-bg);color:var(--blue);}
/* 大方向卡：编号 + 今日行动chips + 可填写卡点/下一步 */
.dir-card{border-top:3px solid var(--main);}
.dir-num{width:28px;height:28px;min-width:28px;border-radius:50%;background:var(--main);color:#fff;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
.field{margin-top:12px;}
.field .fl{display:block;font-size:12px;font-weight:700;margin-bottom:5px;}
.field .fl.blk{color:var(--orange);}
.field .fl.nxt{color:var(--blue);}
.field input{border:1px solid var(--border);border-radius:8px;padding:10px 12px;width:100%;font-size:14px;background:#fff;min-height:44px;}
.act-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
.tchip{font-size:12px;border-radius:16px;padding:3px 10px;background:var(--gray-bg);color:var(--text-dim);display:inline-flex;gap:4px;align-items:center;white-space:nowrap;max-width:100%;}
.tchip .x{color:var(--orange);}
.tchip.on{background:var(--main-light);color:var(--main-dark);text-decoration:line-through;}
.tchip.on .x{text-decoration:none;}
.lk-toggle{border:1px dashed var(--border);background:var(--card);color:var(--text-dim);border-radius:8px;min-height:40px;width:100%;cursor:pointer;font-size:12px;margin-top:12px;}
.lk-toggle:active{border-color:var(--main);color:var(--main-dark);}
.ov-ring{width:46px;height:46px;flex-shrink:0;border-radius:50%;background:conic-gradient(var(--main) calc(var(--p)*1%), var(--border) 0);display:flex;align-items:center;justify-content:center;position:relative;}
.ov-ring::before{content:"";position:absolute;inset:5px;background:var(--card);border-radius:50%;}
.ov-ring b{position:relative;font-size:12px;color:var(--main-dark);}
.ov-num{font-size:22px;font-weight:700;color:var(--main-dark);flex-shrink:0;min-width:44px;text-align:center;}
.ov-num small{font-size:12px;color:var(--text-dim);font-weight:500;}
.ov-num.unrated{font-size:15px;color:var(--text-place);}
.ov-meta{min-width:0;}
.ov-label{font-size:12px;color:var(--text-dim);white-space:nowrap;}
.ov-sub{font-size:11px;color:var(--text-place);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* 模块 */
.module{padding:18px 22px 0;display:none;}
.module.active{display:block;}
.module h2{font-size:20px;color:var(--main-dark);margin-bottom:4px;}
.module .sub{font-size:13px;color:var(--text-dim);margin-bottom:16px;}
.banner{background:var(--main-light);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--main-dark);margin-bottom:14px;}
/* ============ 任务：艾森豪威尔矩阵 ============ */
.collapsible{width:100%;text-align:left;border:1px solid var(--main);background:var(--card);color:var(--main-dark);border-radius:10px;min-height:46px;padding:0 16px;cursor:pointer;font-size:15px;font-weight:600;margin-bottom:10px;}
.done-panel{background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:12px 16px;margin-bottom:14px;font-size:14px;}
.matrix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
.quad{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);border-top:3px solid var(--qc);display:flex;flex-direction:column;min-width:0;}
.quad-head{display:flex;align-items:center;gap:8px;padding:12px 14px 6px;}
.quad-name{font-weight:700;font-size:15px;color:var(--qc);}
.quad-desc{font-size:11px;color:var(--text-place);}
.quad-cnt{margin-left:auto;font-size:12px;color:var(--text-dim);background:var(--bg);border-radius:12px;padding:2px 10px;white-space:nowrap;}
.quad-body{padding:6px 12px 12px;display:flex;flex-direction:column;gap:8px;}
.task-row{
  position:relative;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;
  display:flex;flex-direction:column;gap:8px;transition:border-color .15s,opacity .2s;
}
.task-row.done{opacity:.55;}
.task-row .row1{display:flex;align-items:flex-start;gap:10px;}
.cb{
  width:24px;height:24px;min-width:24px;border-radius:7px;border:2px solid var(--main);cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;background:transparent;flex-shrink:0;margin-top:1px;
}
.task-row.done .cb{background:var(--done);border-color:var(--done);}
.tname{flex:1;min-width:0;font-size:15px;font-weight:500;color:var(--text);word-break:break-word;line-height:1.4;}
.task-row.done .tname{text-decoration:line-through;color:var(--text-dim);}
.tmore{
  border:none;background:var(--card);border:1px solid var(--border);border-radius:8px;min-width:40px;min-height:40px;
  cursor:pointer;font-size:16px;color:var(--text-dim);flex-shrink:0;line-height:1;
}
.tmore:active{background:var(--main-light);border-color:var(--main);}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-left:34px;}
.chip{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:3px;}
.chip.time{background:#fdf6ec;color:#b26a13;}
.chip.est{background:#eef3ee;color:var(--text-dim);}
.chip.cat{background:#fff;border:1px solid var(--border);color:var(--text-dim);}
.chip.diff-hard{background:var(--red-bg);color:var(--red);}
.chip.diff-mid{background:var(--gray-bg);color:var(--text-dim);}
.chip.diff-easy{background:var(--main-light);color:var(--main);}
.chip.reason{background:var(--orange-bg);color:var(--orange);}
/* 未完成原因：单行轻量展开，不占视觉重量 */
.reason-line{margin-top:2px;padding-left:34px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;}
.reason-toggle{border:none;background:transparent;color:var(--text-place);font-size:12px;cursor:pointer;padding:6px 2px;min-height:32px;}
.reason-toggle:active{color:var(--orange);}
.r-chip{border:1px solid var(--border);background:var(--card);border-radius:16px;min-height:34px;padding:4px 12px;cursor:pointer;font-size:12px;color:var(--text-dim);}
.r-chip:active{border-color:var(--main);color:var(--main-dark);}
.reason-done{color:var(--orange);font-weight:600;}
.empty-q{font-size:13px;color:var(--text-place);text-align:center;padding:16px 8px;border:1px dashed var(--border);border-radius:10px;}
.add-task{margin-top:12px;border:1px dashed var(--main);color:var(--main);background:transparent;border-radius:10px;min-height:44px;width:100%;cursor:pointer;font-size:14px;}
.add-task:active{background:var(--main-light);}
.tasks-footer{margin-top:18px;text-align:center;}
.restore-btn{border:1px dashed var(--border);background:transparent;color:var(--text-dim);border-radius:10px;min-height:44px;padding:0 20px;cursor:pointer;font-size:13px;}
/* ============ 习惯 ============ */
.habit-today{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.ht-card{
  flex:1;min-width:150px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);
}
.ht-card.on{border-color:var(--main);background:var(--main-light);}
.ht-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.ht-name{font-weight:700;color:var(--main-dark);font-size:15px;word-break:break-all;}
.ht-check{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex-shrink:0;background:var(--card);}
.ht-card.on .ht-check{background:var(--done);border-color:var(--done);}
.ht-stats{font-size:12px;color:var(--text-dim);display:flex;gap:10px;flex-wrap:wrap;}
.ht-stats b{color:var(--main-dark);}
.add-habit{border:1px dashed var(--main);color:var(--main);background:transparent;border-radius:10px;min-height:44px;padding:0 18px;cursor:pointer;font-size:14px;}
.cal{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;max-width:440px;}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;}
.cal-title{font-weight:700;color:var(--main-dark);font-size:14px;}
.cal-nav{border:none;background:var(--main-light);color:var(--main-dark);border-radius:8px;min-width:40px;min-height:40px;cursor:pointer;font-size:14px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{text-align:center;font-size:11px;color:var(--text-place);padding:4px 0;}
.cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;font-size:12px;color:var(--text-dim);position:relative;}
.cal-cell.today{box-shadow:inset 0 0 0 2px var(--blue);}
.cal-cell.on{background:var(--main-light);color:var(--main-dark);font-weight:700;}
.cal-cell .dot{width:6px;height:6px;border-radius:50%;background:var(--done);position:absolute;bottom:3px;}
.cal-cell.empty{visibility:hidden;}
.cal-tip{font-size:12px;color:var(--text-dim);margin-top:12px;}
/* ============ 目标 ============ */
.quarter-box{border:1px solid var(--main);border-radius:10px;padding:12px;width:100%;font-size:15px;}
.kr-list{display:flex;flex-direction:column;gap:14px;margin:16px 0;}
.kr-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;}
.kr-desc{border:1px solid var(--border);border-radius:8px;padding:10px;width:100%;font-size:14px;}
.kr-row{display:flex;align-items:center;gap:10px;margin-top:12px;}
.kr-bar{flex:1;height:8px;border-radius:6px;background:var(--border);overflow:hidden;}
.kr-fill{height:100%;background:var(--accent);border-radius:6px;transition:width .3s;}
.kr-pct{font-size:13px;color:var(--main-dark);min-width:42px;text-align:right;white-space:nowrap;}
.kr-badge{font-size:10px;background:var(--blue-bg);color:var(--blue);border-radius:8px;padding:2px 8px;white-space:nowrap;}
.kr-auto-hint{font-size:12px;color:var(--text-dim);margin-top:8px;background:var(--bg);border-radius:8px;padding:8px 10px;line-height:1.5;}
.quarter-goal-input{width:100%;box-sizing:border-box;margin-top:8px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:#fff;color:var(--text);}
.quarter-goal-input:focus{outline:none;border-color:var(--main);}
.linked{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.linked label{font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:4px;cursor:pointer;border:1px solid var(--border);border-radius:14px;padding:4px 10px;background:var(--bg);}
.linked label:has(input:checked){border-color:var(--main);background:var(--main-light);color:var(--main-dark);}
.goal-overall{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-top:8px;}
/* ============ 此时此刻 ============ */
.moment-input{border:1px solid var(--main);border-radius:10px;padding:12px;width:100%;min-height:96px;font-size:15px;resize:vertical;}
.mform{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.moment-f{border:1px solid var(--border);border-radius:10px;padding:11px 12px;width:100%;font-size:15px;background:#fff;min-height:44px;line-height:1.6;resize:none;box-sizing:border-box;font-family:inherit;}
.moment-f:focus{border-color:var(--main);outline:none;}
.emo-tags{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;}
.emo-tag{border:1px solid var(--border);background:var(--card);border-radius:20px;min-height:42px;padding:0 16px;cursor:pointer;font-size:14px;color:var(--text-dim);}
.emo-tag.active{background:var(--main-light);border-color:var(--main);color:var(--main-dark);font-weight:600;}
.btn-primary{background:var(--main);color:#fff;border:none;border-radius:10px;min-height:46px;padding:0 22px;cursor:pointer;font-size:15px;}
.btn-primary:active{background:var(--main-dark);}
.moment-list{margin-top:18px;display:flex;flex-direction:column;gap:10px;}
.moment-item{background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;}
.moment-item .mt{font-size:12px;color:var(--text-place);white-space:nowrap;padding-top:2px;}
.moment-item .me{font-size:16px;}
.saved-card{background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,255,255,.7));border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:13.5px;}
.saved-row{margin-top:6px;line-height:1.6;word-break:break-word;color:var(--text);}
.saved-row b{color:var(--main-dark);}
.moment-item .mc{flex:1;font-size:14px;word-break:break-word;overflow-wrap:anywhere;line-height:1.65;}
.mm-sec{display:flex;gap:8px;margin-top:7px;line-height:1.65;}
.mm-sec:first-of-type{margin-top:0;}
.mm-lab{flex-shrink:0;font-size:11px;font-weight:700;color:var(--text-dim);background:var(--bg);border-radius:6px;padding:2px 9px;height:fit-content;white-space:nowrap;margin-top:2px;}
.moment-item .mc b{color:var(--main-dark);}
.moment-item .mc .lb{font-size:12px;color:var(--text-place);}
.moment-del{border:none;background:transparent;color:var(--text-place);cursor:pointer;font-size:14px;min-width:34px;min-height:34px;}
.moment-stat{font-size:13px;color:var(--text-dim);margin-top:12px;}
/* ============ 复盘 ============ */
.ctx-strip{background:var(--main-light);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--main-dark);margin:4px 0 14px;display:flex;flex-wrap:wrap;gap:6px 14px;}
.ctx-strip b{color:var(--main-dark);}
.score-row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px;}
.score-circle{width:42px;height:42px;border-radius:50%;border:2px solid var(--border);background:var(--card);color:var(--text-dim);cursor:pointer;font-size:15px;}
.score-circle.active{background:var(--main);border-color:var(--main);color:#fff;}
.mood-row{display:flex;gap:10px;margin:8px 0 14px;}
.mood-btn{border:1px solid var(--border);background:var(--card);border-radius:10px;min-height:46px;padding:0 18px;cursor:pointer;font-size:15px;color:var(--text-dim);}
.mood-btn.active{border-color:var(--main);background:var(--main-light);color:var(--main-dark);font-weight:600;}
.review-input{border:1px solid var(--border);border-radius:10px;padding:12px;width:100%;font-size:15px;margin:6px 0 14px;resize:vertical;}
.rv-hint{font-size:12px;color:var(--blue);background:var(--blue-bg);border-radius:8px;padding:8px 12px;margin:-6px 0 12px;cursor:pointer;}
.auto-eval{background:var(--main-light);border-radius:8px;padding:12px;color:var(--main-dark);font-size:14px;margin:4px 0 12px;}
.review-hist{margin-top:16px;display:flex;flex-direction:column;gap:8px;}
.review-hist .rh{background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:12px;font-size:13px;color:var(--text-dim);cursor:pointer;}
.review-hist .rh b{color:var(--main-dark);}
/* ============ 每日总结 ============ */
.sum-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px;}
.sum-card h3{font-size:15px;color:var(--main-dark);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.sum-card h3 .n{font-size:12px;color:var(--text-place);font-weight:400;}
.sum-list{list-style:none;display:flex;flex-direction:column;gap:7px;}
.sum-list li{font-size:14px;display:flex;gap:8px;align-items:flex-start;}
.sum-list li .mk{color:var(--done);flex-shrink:0;}
.sum-list li.undone .mk{color:var(--undone);}
.sum-list li .rs{color:var(--orange);font-size:12px;margin-left:6px;}
.sum-list li .tm{color:var(--text-place);font-size:12px;margin-left:6px;white-space:nowrap;}
.sum-list li .nxt{color:var(--blue);font-size:12px;margin-top:3px;}
/* ============ 周检视 ============ */
.week-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px;}
.week-card h3{font-size:15px;color:var(--main-dark);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.week-card h3 .n{font-size:12px;color:var(--text-place);font-weight:400;}
.week-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.wg-cell{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--text-dim);}
.wg-cell b{display:block;font-size:20px;color:var(--main-dark);margin-top:2px;}
.wg-cell .up{color:var(--done);font-size:12px;font-weight:600;}
.wg-cell .down{color:var(--undone);font-size:12px;font-weight:600;}
.wg-cell .flat{color:var(--text-place);font-size:12px;font-weight:600;}
.bar-row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px;color:var(--text-dim);}
.bar-row .bl{width:64px;flex-shrink:0;}
.bar-row .bt{flex:1;background:var(--bg);border-radius:6px;height:14px;overflow:hidden;min-width:40px;}
.bar-row .bf{height:14px;border-radius:6px;background:var(--main);}
.bar-row .bv{width:36px;text-align:right;flex-shrink:0;color:var(--main-dark);font-weight:600;}
.alert-box{background:rgba(230,126,34,.08);border:1px solid #e67e22;border-radius:10px;padding:10px 12px;font-size:13px;color:#8a4b06;margin:6px 0;line-height:1.6;}
.alert-box.red{background:rgba(214,69,65,.07);border-color:#d64541;color:#8a1f1c;}
.alert-box.green{background:rgba(82,196,26,.07);border-color:#52C41A;color:#2f6b10;}
/* ============ 驱动元素 ============ */
.main-focus{background:linear-gradient(135deg,rgba(41,128,185,.06),rgba(41,128,185,.14));border:2px solid #2980b9;border-radius:14px;padding:14px 16px;margin-bottom:12px;}
.main-focus .mf-hint{font-size:13px;color:#1f6fa8;font-weight:600;margin-bottom:6px;}
.main-focus .mf-big{font-size:20px;font-weight:700;color:var(--main-dark);line-height:1.5;margin-bottom:6px;}
.focus-banner{background:var(--main-light);border-left:4px solid var(--main);border-radius:10px;padding:11px 14px;font-size:13px;color:var(--main-dark);margin-bottom:12px;line-height:1.6;}
.focus-banner b{color:var(--main-dark);}
.energy-chip{font-size:11px;border-radius:10px;padding:2px 8px;background:var(--gray-bg);color:var(--text-dim);}
.energy-chip.e-high{background:#fdecea;color:#c0392b;}
.energy-chip.e-mid{background:#fdf3e4;color:#a35d10;}
.energy-chip.e-low{background:#e7f0f8;color:#1f6fa8;}
.promise-tag{font-size:10px;background:#e8ece8;color:#5f7a68;padding:1px 6px;border-radius:4px;margin-right:6px;}
.step-line{font-size:12px;color:#1f6fa8;background:rgba(41,128,185,.06);border-radius:6px;padding:3px 8px;margin-top:5px;display:inline-block;}
.sum-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.sum-grid .cell{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--text-dim);}
.sum-grid .cell b{display:block;font-size:18px;color:var(--main-dark);margin-top:2px;}
.sum-greet{font-size:18px;font-weight:700;color:var(--main-dark);}
.copy-btn{border:1px solid var(--main);background:transparent;color:var(--main);border-radius:10px;min-height:42px;padding:0 18px;cursor:pointer;font-size:14px;margin-top:8px;}
.day-log{background:var(--card);border-radius:10px;border:1px solid var(--border);padding:12px 14px;margin-bottom:8px;font-size:13px;color:var(--text-dim);}
.day-log b{color:var(--main-dark);}
.day-log .dl-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.dl-tag{font-size:11px;background:var(--bg);border-radius:6px;padding:2px 8px;color:var(--text-dim);}
/* ============ 弹窗 / 抽屉 ============ */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal-mask.open{display:flex;}
.modal{background:var(--card);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:20px;width:100%;max-width:400px;max-height:88dvh;overflow-y:auto;}
.modal h3{font-size:16px;color:var(--main-dark);margin-bottom:14px;}
.modal label{display:block;font-size:13px;color:var(--text-dim);margin:12px 0 5px;}
.modal input[type=text],.modal input[type=number],.modal input[type=time]{border:1px solid var(--border);border-radius:8px;padding:10px 12px;width:100%;font-size:15px;min-height:46px;background:#fff;}
.pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;}
.pick-grid button{border:1px solid var(--border);background:var(--card);border-radius:10px;min-height:48px;cursor:pointer;font-size:13px;color:var(--text-dim);padding:8px 6px;}
.pick-grid button.active{background:var(--main-light);border-color:var(--main);color:var(--main-dark);font-weight:600;}
.pick-grid button .pdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;}
.quick-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.quick-row button{border:1px solid var(--border);background:var(--card);border-radius:14px;min-height:42px;padding:0 12px;cursor:pointer;font-size:13px;color:var(--text-dim);}
.quick-row button.active{background:var(--main);color:#fff;border-color:var(--main);}
.cmp-start{font-size:13px;color:var(--main-dark);margin-top:6px;min-height:18px;}
.modal-actions{display:flex;gap:10px;margin-top:18px;}
.modal-actions button{flex:1;border-radius:10px;min-height:46px;cursor:pointer;font-size:15px;}
.btn-confirm{background:var(--main);color:#fff;border:none;}
.btn-cancel{background:transparent;border:1px solid var(--border);color:var(--text-dim);}
/* 操作抽屉 */
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:60;}
.sheet-mask.open{display:flex;}
.sheet{background:var(--card);border-radius:18px 18px 0 0;width:100%;max-width:480px;padding:10px 16px calc(16px + env(safe-area-inset-bottom));animation:sheetUp .22s ease;}
@keyframes sheetUp{from{transform:translateY(60px);opacity:.4;}to{transform:none;opacity:1;}}
.sheet-title{font-size:14px;color:var(--text-place);text-align:center;padding:8px 0 12px;}
.sheet-btn{display:flex;align-items:center;gap:12px;width:100%;border:none;background:transparent;min-height:52px;padding:0 14px;font-size:15px;color:var(--text);border-radius:10px;cursor:pointer;text-align:left;}
.sheet-btn:active{background:var(--bg);}
.sheet-btn.danger{color:var(--red);}
.sheet-sep{height:1px;background:var(--border);margin:4px 0;}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--main);color:#fff;padding:10px 20px;border-radius:24px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:80;max-width:90vw;text-align:center;}
.toast.show{opacity:1;}
.safety-hint{text-align:center;font-size:11px;color:var(--text-place);padding:8px 10px;margin-top:10px;}
/* ============ 移动端 ============ */
@media(max-width:768px){
  body{font-size:15px;}
  .app{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;flex-direction:row;align-items:center;padding:4px 4px calc(4px + env(safe-area-inset-bottom));border-right:none;border-top:1px solid var(--border);background:rgba(255,255,255,.96);backdrop-filter:blur(8px);}
  .brand,.nav-date,.nav-bottom{display:none;}
  .nav-items{flex-direction:row;flex:1;gap:2px;padding:0;}
  .nav-item{flex:1;flex-direction:column;gap:1px;min-height:52px;padding:4px 2px;font-size:9.5px;justify-content:center;border-radius:10px;}
  .nav-item .ico{font-size:17px;width:auto;}
  .nav-item .bdg{display:none;}
  .nav-item.active{background:var(--main-light);}
  .content{width:100%;padding-bottom:calc(64px + env(safe-area-inset-bottom));}
  .topbar{padding:12px 14px 0;flex-wrap:wrap;gap:8px;}
  .tb-title{font-size:17px;}
  .tb-date{font-size:12px;padding:5px 12px;}
  .module{padding:14px 14px 0;}
  .matrix{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
  .quad-head{padding:10px 10px 4px;flex-wrap:wrap;}
  .quad-name{font-size:13px;}
  .quad-desc{display:none;}
  .quad-cnt{font-size:11px;padding:2px 8px;}
  .quad-body{padding:4px 8px 10px;gap:8px;}
  .task-row{padding:10px;}
  .chips,.reason-line{padding-left:0;}
  .tname{font-size:15px;}
  .tmore{min-width:38px;min-height:38px;}
  .ht-card{min-width:140px;}
  .sum-grid{grid-template-columns:1fr 1fr;}
  .modal-mask{padding:0;align-items:flex-end;}
  .modal{border-radius:18px 18px 0 0;max-width:100%;max-height:86dvh;padding:20px 18px calc(20px + env(safe-area-inset-bottom));}
  /* 输入框 ≥16px，避免 iOS 聚焦自动放大 */
  input,textarea,select{font-size:16px !important;}
  .pick-grid button,.quick-row button,.r-chip,.emo-tag{font-size:14px;}
}
@media(max-width:380px){
  .matrix{grid-template-columns:1fr;}
  .nav-item{font-size:9px;}
}

/* ================= 今日闭环进度引擎 ================= */
.loop-bar{
  position:sticky;top:0;z-index:30;
  background:linear-gradient(90deg,var(--main-light),#ffffff);
  border:1px solid var(--border);border-radius:12px;
  padding:10px 12px;margin:-4px 0 14px;
  display:flex;flex-direction:column;gap:8px;
  box-shadow:0 1px 4px rgba(0,0,0,0.04);
}
.loop-track{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.loop-stage{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12px;padding:4px 10px;border-radius:14px;
  border:1px solid var(--border);background:var(--card);color:var(--text-dim);
}
.loop-stage .dot{width:14px;height:14px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;background:var(--border);color:#fff;}
.loop-stage.done{background:var(--main-light);border-color:var(--main);color:var(--main-dark);}
.loop-stage.done .dot{background:var(--main);}
.loop-stage.cur{border-color:var(--main);color:var(--main-dark);font-weight:600;box-shadow:0 0 0 2px var(--main-light);}
.loop-arrow{color:var(--text-place);font-size:12px;}
.loop-next{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:13px;color:var(--main-dark);font-weight:600;
  background:var(--main-light);border-radius:8px;padding:7px 10px;
}
.loop-next .lbl{color:var(--text-dim);font-weight:400;}

/* 此时此刻升级 */
.moment-link{margin-top:8px;}
.verify-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.verify-btn{border:1px solid var(--border);background:var(--card);border-radius:14px;min-height:38px;padding:0 12px;cursor:pointer;font-family:inherit;font-size:12px;color:var(--text-dim);}
.verify-btn.on[data-v="ok"]{background:#e8f5ee;border-color:var(--main);color:var(--main-dark);}
.verify-btn.on[data-v="no"]{background:#fdecea;border-color:#d64541;color:#d64541;}
.verify-btn.on[data-v="wait"]{background:#fdf3e4;border-color:#e67e22;color:#b9760d;}
.promote-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.promote-btn{border:1px dashed var(--main);color:var(--main);background:transparent;border-radius:14px;min-height:34px;padding:0 10px;cursor:pointer;font-family:inherit;font-size:12px;}
.promote-btn:active{background:var(--main-light);}
.emotion-trend{font-size:12px;color:var(--text-dim);margin-top:8px;background:var(--bg);border-radius:8px;padding:6px 10px;}
.moment-item .mc .lb{color:var(--text-place);font-weight:600;margin-right:2px;}
.moment-item .mc .ok{color:var(--done);}
.moment-item .mc .no{color:#d64541;}
.moment-item .mc .wait{color:#e67e22;}
.moment-promoted{font-size:11px;color:var(--main);margin-top:4px;}
.hint-mini{font-size:11px;color:var(--text-place);margin:2px 0 0;}
.scaffold-card{background:var(--bg);border:1px dashed var(--border);border-radius:10px;padding:10px 12px;margin-bottom:12px;}
.jump{cursor:pointer;color:var(--main-dark);border-bottom:1px dotted var(--main);}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="brand">🧭 个人成长工作台<span>LIFE COCKPIT</span></div>
    <div class="nav-date" id="navDate"></div>
    <div class="nav-items">
      <button class="nav-item active" data-mod="tasks"><span class="ico">📋</span>今日任务</button>
      <button class="nav-item" data-mod="habits"><span class="ico">🔥</span>习惯打卡</button>
      <button class="nav-item" data-mod="goals"><span class="ico">🎯</span>我的目标</button>
      <button class="nav-item" data-mod="moments"><span class="ico">🧠</span>此时此刻</button>
      <button class="nav-item" data-mod="review"><span class="ico">📝</span>今日复盘</button>
      <button class="nav-item" data-mod="summary"><span class="ico">📊</span>每日总结</button>
      <button class="nav-item" data-mod="weekly"><span class="ico">🗓️</span>周检视</button>
    </div>
    <div class="nav-bottom">
      <button class="nav-btn" id="btnExport">📤 导出数据</button>
      <button class="nav-btn" id="btnImport">📥 导入数据</button>
    </div>
  </nav>
  <main class="content">
    <div class="topbar">
      <div class="tb-title">个人成长工作台<small>LIFE COCKPIT</small></div>
      <div class="tb-date" id="tbDate"></div>
    </div>
    <div class="loop-bar" id="loopBar"></div>
    <section class="module active" id="mod-tasks"><div id="tasksInner"></div></section>
    <section class="module" id="mod-habits"><div id="habitsInner"></div></section>
    <section class="module" id="mod-goals"><div id="goalsInner"></div></section>
    <section class="module" id="mod-moments"><div id="momentsInner"></div></section>
    <section class="module" id="mod-review"><div id="reviewInner"></div></section>
    <section class="module" id="mod-summary"><div id="summaryInner"></div></section>
    <section class="module" id="mod-weekly"><div id="weeklyInner"></div></section>
    <div class="safety-hint">数据保存在当前浏览器的本地存储中，卸载浏览器或清除缓存会丢失，请定期「导出数据」备份。</div>
  </main>
</div>

<input type="file" id="importFile" accept="application/json" hidden>
<div class="toast" id="toast"></div>

<!-- 添加/编辑任务弹窗 -->
<div class="modal-mask" id="taskModal">
  <div class="modal">
    <h3 id="taskModalTitle">添加任务</h3>
    <label>任务名称（写清楚要做什么）</label>
    <input type="text" id="taskName" placeholder="例如：写完本周复盘文章">
    <label>放在哪个象限？</label>
    <div class="pick-grid" id="priPick">
      <button data-p="p1"><span class="pdot" style="background:#d64541"></span>紧急·重要</button>
      <button data-p="p2"><span class="pdot" style="background:#e67e22"></span>紧急·不重要</button>
      <button data-p="p3"><span class="pdot" style="background:#2980b9"></span>不紧急·重要</button>
      <button data-p="p4"><span class="pdot" style="background:#7f8c8d"></span>不紧急·不重要</button>
    </div>
    <label>所属类别（决定标签颜色）</label>
    <div class="pick-grid" id="catPick">
      <button data-c="create">🧠 烧脑创造</button>
      <button data-c="errand">🧹 杂事清理</button>
      <button data-c="people">👥 与人相关</button>
      <button data-c="relax">🌿 回血放松</button>
    </div>
    <label>安排时段（决定时间轴顺序）</label>
    <div class="pick-grid" id="slotPick">
      <button data-s="morning">🌅 早上 6-9点</button>
      <button data-s="am">☀️ 上午 9-12点</button>
      <button data-s="pm">🌇 下午 12-17点</button>
      <button data-s="night">🌙 晚上 17-22点</button>
      <button data-s="">⚙️ 自动推荐</button>
    </div>
    <label>耗能（深度任务放精力高峰，低耗能放晚上）</label>
    <div class="pick-grid" id="energyPick">
      <button data-e="high">⚡ 高耗能（深度专注）</button>
      <button data-e="mid">⚡ 中耗能</button>
      <button data-e="low">⚡ 低耗能（随手做）</button>
    </div>
    <label>具体时间（可选，如 14:30，留空则不显示具体钟点）</label>
    <input type="time" id="taskTime">
    <label>第一步动作（动词+对象，小到能直接启动）</label>
    <input type="text" id="taskFirstStep" placeholder="不是"做口播"，而是：打开剪映，剪开头3秒">
    <label>预计用时（分钟）</label>
    <input type="number" id="taskEst" placeholder="40" min="1" value="30">
    <div class="modal-actions">
      <button class="btn-cancel" id="taskCancel">取消</button>
      <button class="btn-confirm" id="taskConfirm">确认添加</button>
    </div>
  </div>
</div>

<!-- 完成任务弹窗 -->
<div class="modal-mask" id="completeModal">
  <div class="modal">
    <h3>完成任务 ✅</h3>
    <label>实际用时（分钟）</label>
    <input type="number" id="cmpActual" min="0" value="30">
    <label>实际开始时间（不选则按当前时间记录）</label>
    <div class="quick-row" id="cmpStartBtns">
      <button data-v="now">现在</button>
      <button data-v="morning">早上</button>
      <button data-v="am">上午</button>
      <button data-v="pm">下午</button>
      <button data-v="night">晚上</button>
    </div>
    <div class="cmp-start" id="cmpStartVal"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="cmpCancel">取消</button>
      <button class="btn-confirm" id="cmpSave">保存</button>
    </div>
  </div>
</div>

<!-- 通用确认弹窗 -->
<div class="modal-mask" id="confirmModal">
  <div class="modal">
    <h3 id="cfgMsg">确定？</h3>
    <div class="modal-actions">
      <button class="btn-cancel" id="cfgNo">取消</button>
      <button class="btn-confirm" id="cfgYes">确定</button>
    </div>
  </div>
</div>

<!-- 任务操作抽屉 -->
<div class="sheet-mask" id="sheetMask">
  <div class="sheet">
    <div class="sheet-title" id="sheetTitle">任务操作</div>
    <button class="sheet-btn" id="shEdit">✏️ 编辑任务</button>
    <button class="sheet-btn" id="shDone">✅ 标记完成 / 撤销完成</button>
    <button class="sheet-btn" id="shUp">▲ 上移</button>
    <button class="sheet-btn" id="shDown">▼ 下移</button>
    <div class="sheet-sep"></div>
    <button class="sheet-btn" id="shMove">↔️ 移动类别（点此选择）</button>
    <div class="sheet-sep"></div>
    <button class="sheet-btn danger" id="shDel">🗑️ 删除任务</button>
    <button class="sheet-btn" id="shClose" style="text-align:center;justify-content:center;color:var(--text-place)">取消</button>
  </div>
</div>

<script>
"use strict";
/* ================= 常量 ================= */
const STORAGE_KEY="lifeCockpitData";
const APP_VERSION="2.0";
const CATS={
  create:{name:"烧脑创造",desc:"需要集中注意力、动脑子的事",dot:"#3a8c6f",icon:"🧠"},
  errand:{name:"杂事清理",desc:"不动脑子但必须做的杂务",dot:"#e8b84a",icon:"🧹"},
  people:{name:"与人相关",desc:"需要跟人打交道的事",dot:"#5ba8c8",icon:"👥"},
  relax:{name:"回血放松",desc:"让自己休息恢复的事",dot:"#e8a87a",icon:"🌿"}
};
const QUAD={
  p1:{label:"紧急·重要",desc:"现在做",color:"#d64541",bg:"#fdecea"},
  p2:{label:"紧急·不重要",desc:"尽快处理/授权",color:"#e67e22",bg:"#fdf3e4"},
  p3:{label:"不紧急·重要",desc:"排期专注做",color:"#2980b9",bg:"#e7f0f8"},

function cnDate(d){const w=["周日","周一","周二","周三","周四","周五","周六"];return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日 "+w[d.getDay()];}
function quarterStr(){const m=new Date().getMonth();return new Date().getFullYear()+"年 Q"+(Math.floor(m/3)+1);}
function pad(n){return String(n).padStart(2,"0");}
function fmtStamp(d){d=d||new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"_"+pad(d.getHours())+"-"+pad(d.getMinutes());}
function uid(){return "id"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function daysInMonth(y,m){return new Date(y,m+1,0).getDate();}
function nowHM(){const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes());}
function addDays(str,n){const d=new Date(str+"T00:00:00");d.setDate(d.getDate()+n);return todayStr(d);}
function escapeHtml(s){return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function recommendSlot(cat,pri,energy){

/* ================= 迁移 ================= */
function migrate(d){
  d=d||{};
  const def=defaultData();
  d.version=APP_VERSION;
  if(!d.tasks) d.tasks=def.tasks;
  for(const c in CATS){ if(!Array.isArray(d.tasks[c])) d.tasks[c]=[]; }
  /* v3.3：示例任务裁剪——除紧急重要(p1)外，每个优先级最多保留 1 个示例 */
  {const keepByP={p1:99,p2:1,p3:1,p4:1},cnt={p1:0,p2:0,p3:0,p4:0};
  for(const c in CATS){
    const kept=[];
    d.tasks[c].forEach(t=>{
      const pri=t.priority||"p3";
      if(t.isExample&&cnt[pri]>=keepByP[pri])return;
      if(t.isExample)cnt[pri]++;
      kept.push(t);
    });
    d.tasks[c]=kept;
  }}
  for(const c in CATS){
    d.tasks[c].forEach(t=>{
      if(!t.id) t.id=uid();
      if(!t.diff) t.diff="mid";
      if(!t.priority) t.priority="p3";
      if(t.timeSlot===undefined||t.timeSlot===null) t.timeSlot=recommendSlot(c,t.priority);
      if(t.time===undefined) t.time=null;
      if(!Array.isArray(t.history)) t.history=[];
      if(t.actualStartTime===undefined) t.actualStartTime=null;
      if(t.reason===undefined) t.reason=null;
      if(t.isExample===undefined) t.isExample=false;
      if(t.energy===undefined) t.energy="mid";
      if(t.fromPromise===undefined) t.fromPromise=false;
      if(t.firstStep===undefined) t.firstStep="";
    });
  }
  if(!Array.isArray(d.habits)||d.habits.length===0) d.habits=def.habits;
  if(!d.goals) d.goals=def.goals;
  if(!Array.isArray(d.goals.krs)) d.goals.krs=def.goals.krs;
  if(d.goals.quarterGoal===undefined) d.goals.quarterGoal="";
  d.goals.krs.forEach(k=>{ if(k.blocker===undefined)k.blocker=""; if(k.next===undefined)k.next=""; });
  if(!Array.isArray(d.moments)) d.moments=[];
  if(!Array.isArray(d.reviews)) d.reviews=[];
  if(!Array.isArray(d.dayLogs)) d.dayLogs=[];
  if(d.review===undefined) d.review=null;
  if(!Array.isArray(d.taskHistory)) d.taskHistory=[];
  if(!d.lastDate) d.lastDate=todayStr();
  if(d.dayFocus===undefined) d.dayFocus=null;
  if(d.dayMain===undefined) d.dayMain=null;
  /* 兼容 v2.5 旧结构：单条 text → items 数组 */
  if(d.dayFocus&&d.dayFocus.text&&!d.dayFocus.items){
    d.dayFocus={date:d.dayFocus.date,items:[{src:d.dayFocus.src||"review",text:d.dayFocus.text}]};
  }
  if(d.weekFocus===undefined) d.weekFocus=null;
  if(d.lastBackupAt===undefined) d.lastBackupAt=null;
  d.habits.forEach(h=>{ if(!h.id) h.id=uid(); if(!h.done) h.done={}; if(!h.icon) h.icon="⭐"; });
  d.moments.forEach(m=>{ if(!m.id) m.id=uid(); if(!m.time) m.time=nowHM(); if(m.ev===undefined)m.ev=""; if(m.fd===undefined)m.fd=""; if(m.ac===undefined)m.ac=""; if(m.ln===undefined)m.ln=""; if(m.verify===undefined)m.verify=""; if(m.taskId===undefined)m.taskId=""; if(m.promoted===undefined)m.promoted=false; if(m.body===undefined)m.body=""; });
  return d;
}

/* 跨天：驱动闭环的核心 —— 承诺传导 + 调整传导 + 历史补全 */
function handleNewDay(){
  const today=todayStr();
  /* 1) 补全漏掉的日子：隔 N 天才打开，中间每天补空快照，历史不断档 */
  let cur=addDays(data.lastDate,1);
  const gap=[];
  while(cur<today){ gap.push(cur); cur=addDays(cur,1); }
  gap.forEach(d=>data.dayLogs.push({date:d,tasks:[],habits:[],moments:[],review:null}));
  /* 2) 快照当天（含目标进度，供周检视停滞检测） */
  const goalPctNow=(()=>{
    const all=[];
    for(const c in CATS) data.tasks[c].forEach(t=>all.push({t,c}));
    const krs=data.goals.krs.map(k=>{
      const linked=(k.linked||[]).map(id=>all.find(x=>x.t.id===id)).filter(Boolean);
      const auto=linked.length?Math.round(linked.filter(x=>x.t.done).length/linked.length*100):null;
      return auto!==null?auto:(Number(k.progress)||0);
    });
    return krs.length?Math.round(krs.reduce((s,x)=>s+x,0)/krs.length):0;
  })();
  const snap={date:data.lastDate,tasks:[],habits:[],moments:[],goalPct:goalPctNow,main:data.dayMain?data.dayMain.text:null,review:data.review?{score:data.review.score,mood:data.review.mood,insight:data.review.insight,tomorrow:data.review.tomorrow,adjust:data.review.adjust,gain:data.review.gain}:null};
  for(const c in CATS){
    data.tasks[c].forEach(t=>{
      snap.tasks.push({name:t.name,cat:c,done:t.done,actual:t.actual,reason:t.reason,priority:t.priority});
      if(!t.done && !t.isExample){
        data.taskHistory.push({cat:c,name:t.name,date:data.lastDate,reason:t.reason||null});
      }
      t.done=false;t.actual=null;t.actualStartTime=null;t.reason=null;
    });
  }
  data.habits.forEach(h=>{ if(h.done[today]) snap.habits.push({name:h.name,icon:h.icon}); });
  (data.moments||[]).filter(m=>m.date===data.lastDate).forEach(m=>snap.moments.push({ev:m.ev,fd:m.fd,ac:m.ac,ln:m.ln,text:m.text,emoji:m.emoji}));
  data.dayLogs.push(snap);
  if(data.dayLogs.length>90) data.dayLogs=data.dayLogs.slice(-90);
  /* 3) 承诺传导：昨晚写的"明天最重要的一件事"→ 自动成为今天的第一个任务 */
  const r=data.review||{};
  const promiseTxt=(r.tomorrow||"").trim();
  if(promiseTxt && !data.tasks.create.some(t=>t.name===promiseTxt)){
    data.tasks.create.unshift({id:uid(),name:promiseTxt,diff:"mid",priority:"p3",timeSlot:recommendSlot("create","p3"),time:null,est:30,done:false,actual:null,actualStartTime:null,history:[],reason:null,isExample:false,energy:"mid",fromPromise:true});
    data._promiseCarried=true;
  }
  /* 4) 注意项传导：昨晚的"要调整的点" + 当天最后一条觉察的"学会了什么" → 今日注意项 */
  const items=[];
  const adjTxt=(r.adjust||"").trim();
  if(adjTxt) items.push({src:"review",text:adjTxt});
  const momToday=(data.moments||[]).filter(m=>m.date===data.lastDate);
  let insightTxt="";
  for(let i=momToday.length-1;i>=0;i--){
    if((momToday[i].ln||"").trim()){ insightTxt=momToday[i].ln.trim(); break; }
  }
  if(insightTxt) items.push({src:"insight",text:insightTxt});
  if(items.length) data.dayFocus={date:today,items:items};
  else data.dayFocus=null;
  /* 5) 主线传导：昨天的"今天只做成一件事"已随快照归档，今天重新定 */
  data.dayMain=null;
  data.review=null;
  data.lastDate=today;
  save();
}

/* ================= 单源数据聚合（打通的关键：所有模块只读这一份） ================= */
function computeToday(){
  const all=[]; // {t,c}
  const quad={};
  QUAD_ORDER.forEach(p=>quad[p]={total:0,done:0,list:[]});
  let estTotal=0,actTotal=0;
  for(const c in CATS){
    (data.tasks[c]||[]).forEach(t=>{
      if(!t)return;
      all.push({t,c});
      const p=t.priority&&quad[t.priority]?t.priority:"p3";
      quad[p].total++;
      if(t.done){quad[p].done++;actTotal+=Number(t.actual||t.est||0);}
      estTotal+=Number(t.est||0);
      if(!t.done)quad[p].list.push({t,c});
    });
  }
  const comp=all.length?Math.round(all.filter(x=>x.t.done).length/all.length*100):0;
  // 习惯
  const habits=data.habits.map(h=>({
    h,
    todayDone:!!h.done[todayStr()],
    month:monthCount(h),
    streak:curStreak(h),
    best:bestStreak(h)
  }));
  const habitTodayTotal=habits.length;
  const habitTodayDone=habits.filter(x=>x.todayDone).length;
  // 本月习惯完成率（到今天为止的应打卡次数中实际打卡占比）
  const y=new Date().getFullYear(),m=new Date().getMonth(),dayNow=new Date().getDate();
  let doneDays=0,slots=0;
  data.habits.forEach(h=>{
    for(let d=1;d<=dayNow;d++){
      const key=y+"-"+pad(m+1)+"-"+pad(d);
      if(h.done[key])doneDays++;
    }
    slots+=dayNow;
  });
  const habitMonthRate=slots?Math.round(doneDays/slots*100):0;
  // 目标：关联任务自动推进
  const krs=data.goals.krs.map(k=>{
    const linked=(k.linked||[]).map(id=>all.find(x=>x.t.id===id)).filter(Boolean);
    let auto=null;
    if(linked.length){
      auto=Math.round(linked.filter(x=>x.t.done).length/linked.length*100);
    }
    return {k,linked,auto,display:linked.length?auto:0};
  });
  const goalPct=krs.length?Math.round(krs.reduce((s,x)=>s+x.display,0)/krs.length):0;
  // 此时此刻（只统计今天）
  const todayMoms=data.moments.filter(m=>m&&(!m.date||m.date===todayStr()));
  const top=topEmotion(todayMoms);
  return {
    all,quad,comp,estTotal,actTotal,
    habits,habitTodayTotal,habitTodayDone,habitMonthRate,
    krs,goalPct,
    moments:todayMoms,topEmo:top,
    review:data.review||{},
    doneList:all.filter(x=>x.t.done),
    undoneList:all.filter(x=>!x.t.done)
  };
}
function monthCount(h){const y=new Date().getFullYear(),m=new Date().getMonth();let n=0;for(const k in h.done){if(k.startsWith(y+"-"+pad(m+1)+"-"))n++;}return n;}
function curStreak(h){let s=0;const d=new Date();for(;;){const k=todayStr(d);if(h.done[k]){s++;d.setDate(d.getDate()-1);}else break;}return s;}
function bestStreak(h){let best=0,cur=0;const keys=Object.keys(h.done).filter(k=>h.done[k]).sort();let prev=null;for(const k of keys){if(!prev||addDays(prev,1)===k){cur++;}else{cur=1;}best=Math.max(best,cur);prev=k;}return best;}
function topEmotion(list){
  const c={};list.forEach(m=>{if(m&&m.emoji)c[m.emoji]=(c[m.emoji]||0)+1;});
  let best=null,bn=0;for(const k in c){if(c[k]>bn){bn=c[k];best=k;}}return best;
}

/* ================= 今日闭环进度引擎：事情→行动→反思验证→沉淀→复盘 ================= */
function loopState(){
  const t=computeToday();
  const today=todayStr();
  const hasPlan=(t.all.length>0)||!!data.dayMain||!!data.dayFocus||!!(data.review&&data.review.tomorrow);
  const actDone=t.comp>0||t.habitTodayDone>0;
  const reflectDone=t.moments.length>0 && t.moments.some(m=>m.ln&&m.ln.trim());
  /* ⑤ 严格执行：复盘闭环要"流"得动——打分(量化今天) + 明天最重要的一件事(流向明天的唯一出口) + 至少一句反思(想明白/要调整/进步) */
  const reviewDone=(data.reviews||[]).some(r=>r.date===today&&r.tomorrow&&r.tomorrow.trim()&&r.score!=null&&((r.insight&&r.insight.trim())||(r.adjust&&r.adjust.trim())||(r.gain&&r.gain.trim())))
    || !!(data.review&&data.review.tomorrow&&data.review.tomorrow.trim()&&data.review.score!=null&&((data.review.insight&&data.review.insight.trim())||(data.review.adjust&&data.review.adjust.trim())||(data.review.gain&&data.review.gain.trim())));
  const distillDone=t.moments.some(m=>m.promoted);
  const stages=[
    {key:"plan",name:"①计划",done:hasPlan},
    {key:"act",name:"②行动",done:actDone},
    {key:"reflect",name:"③反思验证",done:reflectDone},
    {key:"distill",name:"④沉淀",done:distillDone},
    {key:"review",name:"⑤复盘总结",done:reviewDone}
  ];
  let curIdx=stages.findIndex(s=>!s.done);   // 当前所处阶段 = 第一个没做完的
  if(curIdx<0)curIdx=stages.length-1;
  let next="";
  const undoneP=t.undoneList.filter(x=>x.t.priority==="p1"||x.t.priority==="p2");
  if(undoneP.length) next="先完成紧急任务："+undoneP[0].t.name;
  else if(!reflectDone && t.moments.length===0) next="记一条「此时此刻」觉察（事件+发现+动作+学会）";
  else if(t.moments.length && !reflectDone) next="给今天的觉察补上「学会/验证」——这是反思验证的关键一步";
  else if(!reviewDone){
    const r=data.review||{};
    const miss=[];
    if(r.score==null)miss.push("给今天打分（0-10）");
    if(!(r.tomorrow&&r.tomorrow.trim()))miss.push("定明天最重要的一件事（会自动变成明天的第一个任务）");
    if(!(r.insight||r.adjust||r.gain))miss.push("写一句反思（想明白的事 / 要调整的点 / 最大的进步，任选其一）");
    next="复盘还差："+miss.join("、");
  }
  else if(!distillDone) next="把一条觉察「沉淀」成习惯或目标，让成长真正留下";
  else next="闭环完成 🎉 看「每日总结」或「导出数据」备份今天";
  return {stages,curIdx,next,hasPlan,actDone,reflectDone,distillDone,reviewDone};
}
function renderLoopBar(){
  const el=document.getElementById("loopBar");

  const s=loopState();

  el.innerHTML=`<div class="loop-track">${chips}</div><div class="loop-next"><span class="lbl">下一步：</span>${escapeHtml(s.next)}</div>`;
}

function quadSort(list){
  return list.sort((a,b)=>{
    const ta=a.t.time||"99:99",tb=b.t.time||"99:99";
    if(ta!==tb)return ta<tb?-1:1;
    return (a.t.est||99)-(b.t.est||99);
  });
}
function renderTasks(){
  const t=computeToday();
  const doneCount=t.doneList.length;
  const focus=data.dayFocus&&data.dayFocus.date===todayStr()?data.dayFocus:null;
  const main=data.dayMain&&data.dayMain.date===todayStr()?data.dayMain:null;
  const mainHTML=main&&main.text?`

function taskRowHTML(c,t){

  const catChip=`<span class="chip cat"><span class="pdot" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${CATS[c].dot};margin-right:3px"></span>${CATS[c].name}</span>`;

  const actualChip=t.done?`<span class="chip est">实际 ${t.actual!=null?t.actual:(t.est!=null?t.est:30)}min</span>`:"";
  const gChips=(krMap()[t.id]||[]).map(g=>`<span class="chip goal">🎯 ${escapeHtml(g.short)}</span>`).join("");
  const reasonRow=!t.done?reasonLineHTML(c,t):"";
  return `<div class="${cls}" data-id="${t.id}">

      <div class="cb" onclick="toggleTask('${c}','${t.id}')">${t.done?"✓":""}</div>
      <span class="tname">${t.isExample?'<span style="font-size:10px;background:#e8ece8;color:#93a89c;padding:1px 6px;border-radius:4px;margin-right:6px">示例</span>':""}${t.fromPromise?'<span class="promise-tag">⏳ 昨日承诺</span>':""}${escapeHtml(t.name||"未命名任务")}</span>
      <button class="tmore" onclick="openSheet('${c}','${t.id}')" title="更多操作">⋯</button>
    </div>
    <div class="chips">${timeChip}${estChip}${catChip}${diffChip}${energyChip}${gChips}${actualChip}</div>
    ${t.firstStep?`<div class="step-line">🚀 第一步：${escapeHtml(t.firstStep)}</div>`:""}

function reasonLineHTML(c,t){

function openSheet(c,id){
  sheetCtx={c,id};

  document.getElementById("sheetMask").classList.add("open");

function closeSheet(){ document.getElementById("sheetMask").classList.remove("open"); }
function sheetAct(act){
  const {c,id}=sheetCtx;
  const t=findTask(c,id);
  closeSheet();
  if(!t)return;
  if(act==="edit") openEditTask(c,id);
  else if(act==="done") toggleTask(c,id);
  else if(act==="up") reorderTask(c,id,-1);
  else if(act==="down") reorderTask(c,id,1);
  else if(act==="del") delTask(c,id);
  else if(act==="move"){
    const to=prompt("移动到哪个类别？\n1 烧脑创造\n2 杂事清理\n3 与人相关\n4 回血放松\n（输入数字）");
    if(!to)return;
    const map={"1":"create","2":"errand","3":"people","4":"relax"};
    if(map[to.trim()]) moveTask(c,id,map[to.trim()]);
    else toast("输入 1-4 选择类别");
  }
}
function delTask(c,id){
  const t=findTask(c,id); if(!t||t.isExample){toast("示例任务不能删除，可直接改内容");return;}
  setConfirm("确定要删除这个任务吗？",()=>{
    const i=data.tasks[c].findIndex(x=>x.id===id);
    if(i>=0)data.tasks[c].splice(i,1);
    reasonOpen.delete(id);
    save();refreshAll();toast("已删除任务");
  });
}
function moveTask(c,id,to){
  const i=data.tasks[c].findIndex(x=>x.id===id);
  if(i<0)return;
  const [t]=data.tasks[c].splice(i,1);
  t.isExample=false;
  data.tasks[to].push(t);
  save();refreshAll();toast("已移动到"+CATS[to].name);
}
function reorderTask(c,id,dir){
  const arr=data.tasks[c].slice();
  const i=arr.findIndex(t=>t.id===id);
  if(i<0)return;
  const j=i+dir;
  if(j<0||j>=arr.length)return;
  [arr[i],arr[j]]=[arr[j],arr[i]];
  data.tasks[c]=arr;
  save();renderTasks();
}

/* ================= 我的目标（季度目标 → 大方向 → 今日行动，一一对应） ================= */
/* 任务 → 关联大方向的映射（任务卡上的 🎯 标记） */
function krMap(){
  const map={};
  data.goals.krs.forEach(k=>{
    const short=(k.desc||"").trim().slice(0,8)||"大方向";
    (k.linked||[]).forEach(id=>{ (map[id]=map[id]||[]).push({krId:k.id,short}); });
  });
  return map;
}
/* 大方向自动卡点文案（作为"卡点"输入框的占位提示，可自行填写覆盖） */
function autoBlockerText(k,linked){
  const undone=linked.filter(x=>!x.t.done);
  if(!k.desc||!k.desc.trim()) return "先填写大方向名称";
  if(!linked.length) return "还没有关联任务——点下方「关联今日任务」勾选";
  if(!undone.length) return "关联任务全部完成，无卡点";
  return undone.map(x=>x.t.name+(x.t.reason?"（"+x.t.reason+"）":"")).join("；");
}
/* 大方向"下一步方向"自动建议（作为输入框占位提示，可自行填写覆盖） */
function suggestionFor(k,linked,undone){
  if(!k.desc||!k.desc.trim()) return "先给大方向起个名字（点上面的输入框填写）。";
  if(!linked.length) return "还没有关联今日行动 → 点下方「关联今日任务」勾选，任务完成自动推进进度。";
  if(!undone.length) return "关联行动已全部完成 🎉 可加新的大方向，或更新季度目标。";
  const first=undone[0];

    return `「${first.t.name}」卡在【${first.t.reason}】→ ${tip}。`;

function toggleLink(id,tid){
  const k=data.goals.krs.find(x=>x.id===id);if(!k)return;
  if(k.linked.includes(tid)){k.linked=k.linked.filter(x=>x!==tid);if(k.counted.includes(tid))k.counted=k.counted.filter(x=>x!==tid);}
  else{k.linked.push(tid);}
  /* 自动归因：关联任务里有未完成且填了原因的，把卡点/下一步自动带进大方向（不覆盖手写内容） */
  const t=computeToday();
  const linked=k.linked.map(tid2=>t.all.find(x=>x.t.id===tid2)).filter(Boolean);
  const undone=linked.filter(x=>!x.t.done);
  if(!k.blocker && undone.length){
    const reasons=undone.filter(x=>x.t.reason).map(x=>x.t.name+"（"+x.t.reason+"）");
    if(reasons.length) k.blocker=reasons.join("；");
  }
  if(!k.next && undone.length) k.next=suggestionFor(k,linked,undone);
  save();renderGoals();toast(k.linked.includes(tid)?"已关联，完成后自动加进度":"已取消关联");
}

/* 闭环第④步：把觉察沉淀成习惯 / 目标方向 / 复盘结论 */
function promoteMoment(id,target){
  const m=data.moments.find(x=>x.id===id);
  if(!m)return;
  const seed=(m.ln&&m.ln.trim())?m.ln.trim():(m.ev&&m.ev.trim()?m.ev.trim():"这条觉察");
  if(target==="habit"){
    data.habits.push({id:uid(),name:seed,icon:"✨",done:{}});
    toast("已沉淀为习惯："+seed);
  }else if(target==="goal"){
    data.goals.krs.push({id:uid(),desc:seed,progress:0,linked:[],counted:[],blocker:"",next:""});
    toast("已沉淀为目标方向："+seed);
  }else if(target==="review"){
    if(!data.review)data.review={};
    data.review.insight=(data.review.insight?data.review.insight+"；":"")+seed;
    toast("已写进今日复盘的「想明白的事」");
  }
  m.promoted=true;promotedMomentIds.add(id);
  save();renderMoments();renderLoopBar();
}

function importInsight(){
  const t=computeToday();
  const lns=t.moments.map(m=>m.ln).filter(x=>x&&x.trim());
  if(!lns.length){toast("今天还没有觉察里的「学会」，先去「此时此刻」写一条");return;}
  const v=lns.join("；");
  const box=document.getElementById("rvInsight");
  box.value=box.value&&box.value.trim()?box.value+"；"+v:v;
  box.focus();
  toast("已导入 "+lns.length+" 条「学会」");
}
function dumpReviewForm(){
  if(!data.review)data.review={};
  const g=id=>{const e=document.getElementById(id);return e?e.value:"";};
  data.review.events=g("rvEvents");
  data.review.insight=g("rvInsight");
  data.review.tomorrow=g("rvTomorrow");
  data.review.adjust=g("rvAdjust");
  data.review.gain=g("rvGain");
}
function fillTomorrow(){
  const t=computeToday();
  const first=t.undoneList.filter(x=>x.t.priority==="p1"||x.t.priority==="p2")[0];
  if(first){
    dumpReviewForm();
    if(!data.review)data.review={};
    data.review.tomorrow=first.t.name;
    save();renderReview();toast("已填入："+first.t.name);
  }else toast("今天没有未完成的紧急任务");
}
function setScore(n){dumpReviewForm();if(!data.review)data.review={};data.review.score=n;save();renderReview();}
function setMood(k){dumpReviewForm();if(!data.review)data.review={};data.review.mood=k;save();renderReview();}
function autoEval(t,r){
  const parts=[];
  if(t.all.length&&t.comp>=80)parts.push("完成度很高，今天状态在线，把这种感觉记下来。");
  else if(t.all.length&&t.comp>=50)parts.push("完成过半，稳扎稳打的一天。");
  else if(t.all.length&&t.comp<50)parts.push("今天完成度偏低，先看未完成原因，明天从一件小事重新开始。");
  const undone=r&&r.tomorrow?"":"明天最重要的一件事还没定，写下来会更聚焦。";
  if(r&&r.insight)parts.push("今天想明白的事值得放进「此时此刻」或知识库。");
  if(parts.length)return parts.join(" ");
  return "填完上面几项，这里会自动给你一句小结。";
}
function saveReview(){
  const r=data.review||{};
  r.events=document.getElementById("rvEvents").value;
  r.insight=document.getElementById("rvInsight").value;
  r.tomorrow=document.getElementById("rvTomorrow").value;
  r.adjust=document.getElementById("rvAdjust").value;
  r.gain=document.getElementById("rvGain").value;
  if(!r.score&&!r.mood&&!r.events&&!r.insight&&!r.tomorrow&&!r.adjust&&!r.gain){toast("还没填任何内容");return;}
  const todayD=todayStr();
  const exist=data.reviews.findIndex(x=>x.date===todayD);
  const snap={date:todayD,score:r.score||null,mood:r.mood||null,events:r.events,insight:r.insight,tomorrow:r.tomorrow,adjust:r.adjust,gain:r.gain};
  if(exist>=0)data.reviews[exist]=snap;else data.reviews.push(snap);
  r.saved=true;
  save();renderReview();
  const miss=[];
  if(r.score==null)miss.push("打分");
  if(!(r.tomorrow&&r.tomorrow.trim()))miss.push("明天最重要的一件事");
  if(!(r.insight&&r.insight.trim()||r.adjust&&r.adjust.trim()||r.gain&&r.gain.trim()))miss.push("一句反思（想明白/要调整/进步）");
  toast(miss.length?("✅ 复盘已保存，但闭环⑤还没完成——还差："+miss.join("、")):"✅ 复盘已保存 · 闭环⑤完成 · 明早任务页顶部会提醒你（要调整的点 / 学会的）");
}

/* 未完成任务 → 下一步建议 */
function nextStepFor(task){
  if(task.reason){
    const tip={"时间不够":"拆小或换到更空的时段","不想做":"降低难度，先从最小的一步开始","太难了":"先拆成更小的一步再试","突发打断":"重新排期，今天或明天补上"}[task.reason];
    if(tip) return tip+"，优先补上";
  }
  if(task.priority==="p1") return "紧急·重要，明天第一优先";
  if(task.priority==="p2") return "紧急，明天尽早处理";
  return "排到明天按计划继续";
}
/* 每日总结：自动生成"要调整的点" */
function autoAdjustPoints(t){
  const pts=[];
  const diff=t.estTotal-t.actTotal;
  if(diff<0)pts.push(`⏱ 时间预估 ${t.estTotal}min 实际 ${t.actTotal}min，超出 ${-diff}min → 明天同类任务把时间估宽一些`);
  t.undoneList.forEach(({t:task})=>pts.push(`⬜「${escapeHtml(task.name||"未命名任务")}」未完成${task.reason?`（${escapeHtml(task.reason)}）`:""} → ${nextStepFor(task)}`));
  t.habits.filter(x=>!x.todayDone).slice(0,3).forEach(x=>pts.push(`🔥「${escapeHtml(x.h.name)}」今天没打卡 → 固定一个时间段做，别等到晚上`));
  return pts;
}
/* 每日总结：自动候选"最大的进步" */
function autoGain(t){
  const g=t.krs.filter(x=>x.display>0).slice(0,1);
  if(g.length&&g[0].k.desc) return `大方向「${g[0].k.desc}」推进到 ${g[0].display}%`;
  if(t.habitTodayDone) return `完成了 ${t.habitTodayDone} 项习惯打卡（连续 ${Math.max(0,...t.habits.filter(x=>x.todayDone).map(x=>x.streak))} 天）`;
  if(t.doneList.length) return `完成了 ${t.doneList.length} 项任务，完成率 ${t.comp}%`;
  return "今天先好好休息，明天从一件小事重新开始";
}

}

/* ================= 导出今日总结 Markdown（知识库闭环：AI 复盘能读到） ================= */
function summaryMD(){
  const t=computeToday();
  const r=t.review;
  const main=data.dayMain&&data.dayMain.date===todayStr()?data.dayMain.text:"";
  const L=[];const P=s=>L.push(s);
  P("# 每日总结 "+todayStr());
  P("");
  P("## 🎯 今日主线（今天只做成一件事）");
  P(main||"（未设置）");
  P("");
  P("## ✅ 今日完成（"+t.doneList.length+"）");
  t.doneList.forEach(({t:task,c})=>P("- "+task.name+"（"+CATS[c].name+"，"+(task.actual!=null?task.actual:(task.est!=null?task.est:30))+"min）"));
  if(!t.doneList.length)P("- 无");
  P("");
  P("## ⬜ 未完成（"+t.undoneList.length+"）原因 → 下一步");
  t.undoneList.forEach(({t:task,c})=>P("- "+task.name+(task.reason?"（原因："+task.reason+"）":"")+" → "+nextStepFor(task)));
  if(!t.undoneList.length)P("- 无");
  P("");
  P("## 🔥 习惯 "+t.habitTodayDone+"/"+t.habitTodayTotal);
  P("");
  P("## 💡 觉察（事件-发现-动作-学会-身体）");
  t.moments.slice().reverse().forEach(m=>{
    if(m.ev)P("- 【"+m.ev+"】发现："+(m.fd||"—")+"；动作："+(m.ac||"—")+"；学会："+(m.ln||"—")+(m.body?"；身体："+m.body:"")+"（"+m.time+"）");
    else P("- "+(m.emoji||"")+m.text+"（"+m.time+"）");
  });
  if(!t.moments.length)P("- 无");
  P("");
  P("## 🎯 目标进展 "+t.goalPct+"%");
  P("");
  P("## 📐 要调整的点");
  P(r.adjust||"（未写）");
  P("");
  P("## 🌟 最大的进步");
  P(r.gain||autoGain(t));
  P("");
  P("## 💡 今日最重要的发现");
  P(r.insight||"（未写）");
  P("");
  P("## 📅 明天最重要的一件事");
  P(r.tomorrow||"（未写）");

}

/* ================= 周检视（驱动闭环：趋势 + 归因 + 警报 + 聚焦） ================= */
function mondayOf(d){d=d||new Date();const day=(d.getDay()+6)%7;const m=new Date(d);m.setDate(m.getDate()-day);return todayStr(m);}
function renderWeekly(){
  const t=computeToday();
  const wkStart=mondayOf();
  const wkEnd=todayStr();
  const dayN=new Date(wkEnd+"T00:00:00").getDay();
  const daysThisWeek=(dayN+6)%7+1;
  /* 本周日志（周一到昨天）+ 今天实时 */
  const logs=[];
  let cur=wkStart;
  while(cur<wkEnd){ const l=data.dayLogs.find(x=>x.date===cur); if(l)logs.push(l); cur=addDays(cur,1); }
  /* 任务聚合 */
  let wkTotal=0,wkDone=0; const reasonCount={};
  const push=(name,cat,done,reason,pri)=>{ wkTotal++; if(done)wkDone++; else if(reason)reasonCount[reason]=(reasonCount[reason]||0)+1; };
  logs.forEach(l=>{(l.tasks||[]).forEach(x=>push(x.name,x.cat,x.done,x.reason,x.priority));});
  t.all.forEach(x=>push(x.t.name,x.c,x.t.done,x.t.reason,x.t.priority));
  const wkComp=wkTotal?Math.round(wkDone/wkTotal*100):0;
  /* 上周同窗口对比 */
  const prevEnd=addDays(wkStart,-1);
  const prevStart=addDays(prevEnd,-(daysThisWeek-1));
  const prevLogs=data.dayLogs.filter(l=>l.date>=prevStart&&l.date<=prevEnd);
  let pvTotal=0,pvDone=0;
  prevLogs.forEach(l=>{(l.tasks||[]).forEach(x=>{pvTotal++;if(x.done)pvDone++;});});
  const pvComp=pvTotal?Math.round(pvDone/pvTotal*100):null;
  /* 习惯 / 觉察 */
  let wkHabit=0,pvHabit=0;
  data.habits.forEach(h=>{
    for(let i=0;i<daysThisWeek;i++){ if(h.done[addDays(wkStart,i)])wkHabit++; }
    for(let i=0;i<daysThisWeek;i++){ if(h.done[addDays(prevStart,i)])pvHabit++; }
  });
  const wkHabitSlots=data.habits.length*daysThisWeek;
  let wkMoms=0; logs.forEach(l=>wkMoms+=(l.moments||[]).length); wkMoms+=t.moments.length;
  /* 目标停滞检测 */
  const wkGoalLogs=data.dayLogs.filter(l=>l.date>=wkStart&&l.date<=wkEnd&&l.goalPct!==undefined&&l.date!==todayStr());
  const lastGoal=wkGoalLogs.length?wkGoalLogs[wkGoalLogs.length-1].goalPct:null;
  const pvGoalLogs=data.dayLogs.filter(l=>l.date>=prevStart&&l.date<=prevEnd&&l.goalPct!==undefined);
  const pvGoal=pvGoalLogs.length?pvGoalLogs[pvGoalLogs.length-1].goalPct:null;
  const stalled=(lastGoal!==null&&pvGoal!==null&&lastGoal===pvGoal&&lastGoal>0&&t.goalPct===lastGoal);
  /* 低分周检测：本周评分均值（评分不再只是记录，参与下周决策） */
  const wkScores=logs.map(l=>l.review&&l.review.score!=null?l.review.score:null).concat(t.review&&t.review.score!=null?[t.review.score]:[]).filter(v=>v!==null);
  const wkAvgScore=wkScores.length?wkScores.reduce((s,v)=>s+v,0)/wkScores.length:null;
  const lowScoreWeek=wkAvgScore!==null&&wkAvgScore<6&&wkScores.length>=2;
  /* 重复失败任务 */
  const prevUndoneNames=new Set();
  prevLogs.forEach(l=>{(l.tasks||[]).filter(x=>!x.done).forEach(x=>prevUndoneNames.add(x.name));});
  const repeatFail=t.undoneList.filter(({t:task})=>prevUndoneNames.has(task.name)).slice(0,5);
  /* 原因分布 */
  const reasons=Object.entries(reasonCount).sort((a,b)=>b[1]-a[1]);
  const maxR=Math.max(1,...reasons.map(x=>x[1]));
  const timeShort=reasonCount["时间不够"]||0;
  const overloaded=(wkTotal>=8&&timeShort>=Math.max(3,Math.ceil(wkTotal*0.4)));
  /* 下周聚焦 */
  const wf=data.weekFocus||{};
  const focusTxt=wf.key===wkStart?(wf.text||""):"";
  const trend= pvComp===null?"—":(wkComp>pvComp?`<span class="up">▲ 较上周 +${wkComp-pvComp}%</span>`:wkComp<pvComp?`<span class="down">▼ 较上周 ${wkComp-pvComp}%</span>`:`<span class="flat">＝ 与上周持平</span>`);
  const reasonBars=reasons.length?reasons.map(([k,n])=>`<div class="bar-row"><span class="bl">${escapeHtml(k)}</span><div class="bt"><div class="bf" style="width:${Math.round(n/maxR*100)}%"></div></div><span class="bv">${n}</span></div>`).join(""):(wkTotal>wkDone?`<div style="font-size:13px;color:var(--text-place)">本周有 ${wkTotal-wkDone} 项未完成但没点原因——未完成任务时点一下「❌ 未完成？点选原因」，周检视才能帮你归因。</div>`:`<div style="font-size:13px;color:var(--text-place)">本周任务全部完成，没有未完成归因 🎉</div>`);
  const loadTip=overloaded?`<div class="alert-box red">⚠️ 负荷警报：本周 ${wkTotal} 项任务中「时间不够」出现 ${timeShort} 次——不是执行力问题，是<b>计划过载</b>。下周先把任务砍掉 1/3，只留最重要的。</div>`:timeShort>0?`<div class="alert-box">💡 归因提示：「时间不够」出现 ${timeShort} 次。若持续出现，优先减任务量，而不是逼自己更快。</div>`:"";
  const stallTip=stalled?`<div class="alert-box red">🛑 停滞警报：大方向进度已连续两周停在 ${lastGoal}%。要么任务没有关联到大方向，要么方向本身要重估——点「我的目标」检查卡点，把下一步改成可执行的最小动作。</div>`:"";
  const scoreTip=lowScoreWeek?`<div class="alert-box red">📉 低分周警报：本周 ${wkScores.length} 天平均评分 ${wkAvgScore.toFixed(1)}/10——不是"状态差"，是系统提示你<b>负担过重或方向不对</b>。下周聚焦：只留 1 件主线 + P1，其余全部砍掉。</div>`:"";
  const repeatHTML=repeatFail.length?repeatFail.map(({t:task,c})=>`<li class="undone"><span class="mk">✕</span><span>${escapeHtml(task.name||"未命名任务")}（${CATS[c].name}）<span class="nxt">连续两周未完成 → 重设计它（拆小/换时段/砍掉），别原样再排一遍</span></span></li>`).join(""):`<li><span class="mk">·</span><span>没有连续两周失败的重复任务</span></li>`;
  const progressBox=pvComp!==null&&wkComp>=pvComp?`<div class="alert-box green">🏆 本周小胜利：完成率 ${pvComp}% → ${wkComp}%，${wkComp>pvComp?"比上周进步了，把这种感觉记住":"与上周持平，稳住就是赢"}。</div>`:"";
  document.getElementById("weeklyInner").innerHTML=`
    <h2>🗓️ 周检视</h2>
    <div class="sub">每周一次的驾驶舱校准：完成率 vs 上周、未完成归因、负荷警报、目标停滞检测。周末花 5 分钟，下周执行才有方向。</div>
    <div class="week-card"><h3>📈 本周概览 <span class="n">${wkStart} ~ ${wkEnd}</span></h3>
      <div class="week-grid">
        <div class="wg-cell">本周完成率<b>${wkComp}%</b>${trend}</div>
        <div class="wg-cell">任务<b>${wkDone}/${wkTotal}</b></div>
        <div class="wg-cell">习惯<b>${wkHabit}/${wkHabitSlots||"—"}</b><span class="${wkHabit>pvHabit?"up":wkHabit<pvHabit?"down":"flat"}">上周 ${pvHabit} 次</span></div>
        <div class="wg-cell">觉察<b>${wkMoms} 条</b></div>
        <div class="wg-cell">目标进度<b>${t.goalPct}%</b></div>
      </div>
      ${progressBox}${overloaded?"":loadTip}${stallTip}${scoreTip}
    </div>
    <div class="week-card"><h3>🔍 未完成原因归因 <span class="n">本周 ${wkTotal-wkDone} 项未完成</span></h3>
      ${reasonBars}
      ${overloaded?loadTip:""}
      <div style="font-size:12px;color:var(--text-place);margin-top:8px">归因口诀：原因集中在「时间不够」= 计划问题 → 减量；集中在「不想做/太难了」= 任务设计问题 → 换形式；「突发打断」= 环境问题 → 留缓冲。</div>
    </div>
    <div class="week-card"><h3>🔄 重复失败任务 <span class="n">上周也没完成的</span></h3>
      <ul class="sum-list">${repeatHTML}</ul>
    </div>
    <div class="week-card"><h3>🎯 下周聚焦</h3>
      <textarea class="review-input" id="wfInput" rows="3" placeholder="写下一周最重要的一件事、要砍掉的事、要改的习惯……保存后它会成为你下周执行的地图。">${escapeHtml(focusTxt)}</textarea>
      <button class="btn-primary" id="wfSave">💾 保存下周聚焦</button>
      ${focusTxt?`<div style="font-size:12px;color:var(--main-dark);margin-top:8px">✅ 本周聚焦已保存：${escapeHtml(focusTxt)}</div>`:""}
    </div>`;
  document.getElementById("wfSave").onclick=()=>{
    const v=document.getElementById("wfInput").value.trim();
    data.weekFocus={key:wkStart,text:v};
    save();renderWeekly();toast(v?"下周聚焦已保存 🎯":"已清空下周聚焦");
  };
}

function countTasks(tasks){let n=0;if(tasks)for(const c in CATS)if(Array.isArray(tasks[c]))n+=tasks[c].length;return n;}
function hasRealData(pkg){
  if(pkg.type==="full")return true;
  const t=pkg.tasks||{};
  for(const k in CATS){ if(Array.isArray(t[k])&&t[k].some(x=>!(x&&x.isExample))) return true; }
  if((pkg.habits||[]).some(h=>h.done&&Object.keys(h.done).length)) return true;
  if((pkg.moments||[]).some(m=>!(m&&m.isExample))) return true;
  if(Array.isArray(pkg.reviews)&&pkg.reviews.length) return true;
  if(pkg.review&&(pkg.review.score||pkg.review.events||pkg.review.insight||pkg.review.tomorrow)) return true;
  const allEx=Object.keys(CATS).every(c=>(pkg.tasks&&pkg.tasks[c]||[]).every(x=>x&&x.isExample));
  const allExMoments=(pkg.moments||[]).every(m=>m&&m.isExample);
  return !(allEx && !(pkg.habits||[]).some(h=>h.done&&Object.keys(h.done).length) && allExMoments && !(pkg.reviews||[]).length);
}
/* 合并导入：跨设备数据统一——按 ID/日期去重合并，绝不覆盖现有数据 */
function mergeImport(cur,pkg){
  /* 任务：同 id 保留两边信息（完成态取已完成、原因取有值的、历史取更长的） */
  for(const c in CATS){
    const map={};
    (cur.tasks[c]||[]).forEach(t=>{if(t&&t.id)map[t.id]=t;});
    (pkg.tasks?pkg.tasks[c]||[]:[]).forEach(t=>{
      if(!t||!t.id)return;
      if(map[t.id]){
        const m=map[t.id];
        if(t.done&&!m.done){m.done=true;m.actual=t.actual;m.actualStartTime=t.actualStartTime;}
        if(t.reason&&!m.reason)m.reason=t.reason;
        if(t.history&&t.history.length&&(!m.history||m.history.length<t.history.length))m.history=t.history;
        if(t.energy&&!m.energy)m.energy=t.energy;
      }else{
        map[t.id]=t;
        cur.tasks[c].push(t);
      }
    });
  }
  /* 习惯：同 id 合并打卡记录 */
  const hm={}; cur.habits.forEach(h=>{if(h.id)hm[h.id]=h;});
  (pkg.habits||[]).forEach(h=>{
    if(hm[h.id]){Object.assign(hm[h.id].done,h.done||{});if(!hm[h.id].icon)hm[h.id].icon=h.icon;}
    else{cur.habits.push(h);if(h.id)hm[h.id]=h;}
  });
  /* 觉察：按 id 去重 */
  const mids=new Set(cur.moments.map(m=>m.id));
  (pkg.moments||[]).forEach(m=>{if(m&&m.id&&!mids.has(m.id)){cur.moments.push(m);mids.add(m.id);}});
  /* 复盘：按 date 去重 */
  const rds=new Set(cur.reviews.map(r=>r.date));
  (pkg.reviews||[]).forEach(r=>{if(r&&r.date&&!rds.has(r.date)){cur.reviews.push(r);rds.add(r.date);}});
  /* 日快照：按 date 合并（任务明细取更全的，目标进度补缺） */
  const lmap={}; cur.dayLogs.forEach(l=>{if(l.date)lmap[l.date]=l;});
  (pkg.dayLogs||[]).forEach(l=>{
    if(!l||!l.date)return;
    if(lmap[l.date]){
      const a=lmap[l.date];
      if((l.tasks||[]).length>(a.tasks||[]).length)a.tasks=l.tasks;
      if(l.goalPct!==undefined&&a.goalPct===undefined)a.goalPct=l.goalPct;
      if(l.main&&!a.main)a.main=l.main;
      if((l.moments||[]).length&&!(a.moments||[]).length)a.moments=l.moments;
    }else{cur.dayLogs.push(l);}
  });
  cur.dayLogs.sort((a,b)=>a.date<b.date?-1:1);
  if(cur.dayLogs.length>90)cur.dayLogs=cur.dayLogs.slice(-90);
  /* 目标：同 id 保留进度更高的，补描述/关联 */
  if(pkg.goals&&pkg.goals.krs){
    pkg.goals.krs.forEach(pk=>{
      const ck=cur.goals.krs.find(x=>x.id===pk.id);
      if(ck){
        if((Number(pk.progress)||0)>(Number(ck.progress)||0))ck.progress=pk.progress;
        if(!ck.desc&&pk.desc)ck.desc=pk.desc;
        if((!ck.linked||!ck.linked.length)&&pk.linked)ck.linked=pk.linked;
        if(!ck.blocker&&pk.blocker)ck.blocker=pk.blocker;
        if(!ck.next&&pk.next)ck.next=pk.next;
      }else if(pk.id){cur.goals.krs.push(pk);}
    });
  }
  if(pkg.weekFocus&&pkg.weekFocus.key)cur.weekFocus=pkg.weekFocus;
  return cur;
}
function importData(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const pkg=JSON.parse(e.target.result);
      if(!pkg||typeof pkg!=="object"){toast("文件格式不对");return;}
      if(!hasRealData(pkg)){toast("导入失败：不是有效备份文件");return;}
      data=migrate(mergeImport(data,pkg));
      save();
      toast(`已合并导入：${countTasks(data.tasks)}条任务，${data.habits.length}条习惯，同ID自动去重，未覆盖现有数据`);
      refreshAll();switchModule("summary");
    }catch(err){toast("导入失败：不是有效JSON");}
  };
  reader.readAsText(file);
}

  document.getElementById("navDate").textContent=cnDate(new Date());
  document.getElementById("tbDate").textContent=cnDate(new Date());
  if(data._promiseCarried){ delete data._promiseCarried; save(); setTimeout(()=>toast("⏳ 昨晚承诺的「明天最重要的一件事」已自动成为今天的第一个任务"),600); }
  renderCurrent();
}
function bindStatic(){
  document.querySelectorAll("[data-mod]").forEach(n=>n.onclick=()=>switchModule(n.dataset.mod));
  document.getElementById("btnExport").onclick=exportData;
  document.getElementById("btnImport").onclick=()=>document.getElementById("importFile").click();
  document.getElementById("importFile").onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value="";};
  // 任务表单
  document.getElementById("taskCancel").onclick=closeTaskModal;
  document.getElementById("taskConfirm").onclick=saveTaskForm;
  document.querySelectorAll("#catPick button").forEach(b=>b.onclick=()=>{form.cat=b.dataset.c;syncPicks();});
  document.querySelectorAll("#priPick button").forEach(b=>b.onclick=()=>{form.pri=b.dataset.p;syncPicks();});
  document.querySelectorAll("#slotPick button").forEach(b=>b.onclick=()=>{form.slot=b.dataset.s?b.dataset.s:null;syncPicks();});
  document.querySelectorAll("#energyPick button").forEach(b=>b.onclick=()=>{form.energy=b.dataset.e;syncPicks();});
  // 完成弹窗
  document.getElementById("cmpCancel").onclick=cmpCancel;
  document.getElementById("cmpSave").onclick=cmpSave;
  document.querySelectorAll("#cmpStartBtns button").forEach(b=>b.onclick=()=>cmpStartPick(b.dataset.v));
  // 确认弹窗
  document.getElementById("cfgNo").onclick=closeConfirm;
  document.getElementById("cfgYes").onclick=confirmYes;
  // 操作抽屉
  document.getElementById("sheetMask").onclick=e=>{if(e.target===e.currentTarget)closeSheet();};
  document.getElementById("shClose").onclick=closeSheet;
  document.getElementById("shEdit").onclick=()=>sheetAct("edit");
  document.getElementById("shDone").onclick=()=>sheetAct("done");
  document.getElementById("shUp").onclick=()=>sheetAct("up");
  document.getElementById("shDown").onclick=()=>sheetAct("down");
  document.getElementById("shMove").onclick=()=>sheetAct("move");
  document.getElementById("shDel").onclick=()=>sheetAct("del");
  // 输入聚焦滚动，避免手机键盘遮挡
  document.addEventListener("focusin",e=>{ if(e.target.matches("input,textarea,select")){ setTimeout(()=>e.target.scrollIntoView({block:"center",behavior:"smooth"}),300); } });
}
load();
bindStatic();
initAll();
</script>
</body>
</html>
